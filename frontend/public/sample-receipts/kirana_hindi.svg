    <rect x="90" y="650" width="4" height="40" fill="#0f172a" />
    <rect x="98" y="650" width="8" height="40" fill="#0f172a" />
    <rect x="110" y="650" width="3" height="40" fill="#0f172a" />
    <rect x="118" y="650" width="10" height="40" fill="#0f172a" />
